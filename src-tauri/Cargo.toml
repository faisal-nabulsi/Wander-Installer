[package]
name = "iloader"
version = "2.3.4"
description = "User-friendly sideloader"
authors = ["nab138"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.57", features = ["usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair"] }
isideload = { version = "0.2.22", features = ["fs-storage"] }
async-trait = "0.1.89"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
tauri-plugin-store = "2"
futures = "0.3.31"
once_cell = "1.21.3"
tauri-plugin-dialog = "2"
reqwest = "0.13.2"
# "time" for the sign-in network deadline in account.rs.
tokio = { version = "1.49.0", features = ["time"] }
tauri-plugin-process = "2"
chrono = "0.4"
tracing-subscriber = "0.3.22"
tracing = "0.1.44"
tracing-appender = "0.2"
rustls = "0.23.36"
plist = "1.8.0"
plist-macro = "0.1.6"
tokio-util = "0.7.18"
rootcause = "0.12.1"
thiserror = "2.0.18"
strum = {version = "0.28.0", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# isideload 0.2.22 with local patches:
# - 2.3.2 (vendor/isideload/src/auth/grandslam.rs): disable connection pooling on the GrandSlam
#   client, mirroring upstream nab138/isideload f6a4d5d. Apple's gsa.apple.com edge serves at
#   most two requests per connection and 429s the rest, so the SRP proof - the third request of
#   every sign-in - always failed on a pooled connection.
# - 2.3.3 (anisette/, auth/, lib.rs): backports of upstream 8ca39b6 (re-provision on -45061),
#   fdb1788 (hsc 409 pushed 2FA code), ac8976d (hsc 434 anisette resync), 20b06c7 (client info
#   override) and the X-Xcode-Version half of 232c7f3, plus re-provisioning when the configured
#   anisette server changes. See CHANGES-2.3.3.md.
# - 2.3.4 (auth/apple_account.rs): censor_email no longer slices by byte, which panicked on an
#   Apple ID whose part before the @ is empty or starts or ends with a non-ASCII letter.
# Vendored instead of repinning to the upstream branch because that branch also drags idevice
# 0.1.58 -> 0.1.68, which breaks the remote-pairing code.
[patch.crates-io]
isideload = { path = "vendor/isideload" }
